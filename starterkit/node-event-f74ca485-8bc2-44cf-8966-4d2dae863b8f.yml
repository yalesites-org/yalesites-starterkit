    blocks:
      -
        uuid: 9fc207e9-68a7-47b0-9c1c-320b6c95150c
        entity_type: block_content
        bundle: text
        base_fields:
          info: 'example event - intro text'
          reusable: false
          langcode: en
          block_revision_id: '81'
          enforce_new_revision: true
        custom_fields:
          field_instructions:
            -
              markup: null
          field_style_variation:
            -
              value: default
          field_text:
            -
              value: "<p>Published events can be dynamically fed into your site using the <strong>Calendar List</strong> or <strong>View Block</strong>. At a minimum, these feeds will display your event's date and title, but by including Teaser Details, you can add a thumbnail image and summary text to help your audience understand what your event is and why they should attend.</p>\r\n"
              format: basic_html
              embed_entities: {  }
      -
        uuid: 2572fd6e-14da-4f35-a2ad-4a8134bd3eaa
        entity_type: block_content
        bundle: text
        base_fields:
          info: 'example event - selecting blocks'
          reusable: false
          langcode: en
          block_revision_id: '82'
          enforce_new_revision: true
        custom_fields:
          field_instructions:
            -
              markup: null
          field_style_variation:
            -
              value: default
          field_text:
            -
              value: "<p>Once you've added essential details, consider which Blocks would be best suited to showcasing your event. For example, a succinct speaker bio in a <strong>Content Spotlight</strong> or <strong>Wrapped Image Block </strong>could make your listing more appealing and help potential attendees get a better sense of what your event will be like.</p>\r\n\r\n<p>If you need to share a collection of images, like when promoting an exhibition, use <strong>Image Grid Block</strong> or <strong>Gallery Block</strong>. Select the Gallery block when you'd like visitors to be able to view larger versions of your images or when you need to provide captions and image attribution.</p>\r\n"
              format: basic_html
              embed_entities: {  }
      -
        uuid: 3ee80b7f-5eaa-4f54-bccf-32c3844ec66e
        entity_type: block_content
        bundle: image
        base_fields:
          info: 'example event - image'
          reusable: false
