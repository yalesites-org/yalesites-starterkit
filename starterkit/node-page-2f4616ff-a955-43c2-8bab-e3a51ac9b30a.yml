              value: "<p>YaleSites simplifies featuring news articles, blog posts, or announcements on your site in an easy-to-scan, visually engaging way.</p>\r\n\r\n<p>Use the <strong>Post Feed Block</strong> to create a dynamic feed with the push of a button. Your feed will automatically update whenever you publish a new Post, and your visitors can use the built-in category filter to engage with ease.</p>\r\n\r\n<p>When creating your Posts, use <strong>Teaser details </strong>to add a thumbnail image and summary text to give your listings more flair.</p>\r\n"
