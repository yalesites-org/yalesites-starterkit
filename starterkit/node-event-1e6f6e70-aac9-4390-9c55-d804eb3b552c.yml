    blocks:
      -
        uuid: 72ac2feb-a9df-470d-bfed-6731dacbb067
        entity_type: block_content
        bundle: text
        base_fields:
          info: 'past events explainer'
          reusable: false
          langcode: en
          block_revision_id: '95'
          enforce_new_revision: true
        custom_fields:
          field_instructions:
            -
              markup: null
          field_style_variation:
            -
              value: default
          field_text:
            -
              value: "<p>If including past events is part of your strategy, consider revisiting your content to ensure it continues to provide value. By offering potential attendees a glimpse into what they missed while showing them what they can expect from your events, you can generate excitement and encourage visitors to attend in the future.</p>\r\n\r\n<p>You might add a video, update your summary, share a collection of images, or include a call to action that connects visitors to an article or blog post recap.</p>\r\n\r\n<p>Whatever your approach, we encourage you to maintain your content in a way that supports your goals as well as your audience's needs.</p>\r\n"
              format: basic_html
              embed_entities: {  }
      -
        uuid: 2966e9ed-65ae-41ec-95e1-7f7f56b9f608
        entity_type: block_content
        bundle: text
        base_fields:
          info: 'past events explainer - using view'
          reusable: false
          langcode: en
          block_revision_id: '99'
          enforce_new_revision: true
        custom_fields:
          field_instructions:
            -
              markup: null
          field_style_variation:
            -
              value: default
          field_text:
            -
              value: "<h2>Create an events archive</h2>\r\n\r\n<p>Use the <strong>View Block</strong> to create an events archive for your site. By adjusting the \"Event Time Period,\" you can display all events in a View or create a View dedicated to Past Events. Select the option that best aligns with your goals and objectives.</p>\r\n"
              format: basic_html
              embed_entities: {  }
